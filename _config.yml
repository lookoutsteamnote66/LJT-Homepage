comments:
  provider: false
atom_feed:
  hide: true
analytics:
  provider: false
og_image: null

# Publish only the existing About page. Template examples remain in the fork
# for reference, but are not part of the generated website.
include:
  - _pages
exclude:
  - _pages/404.md
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/publications.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html
  - _drafts
  - _portfolio
  - _posts
  - _publications
  - _talks
  - _teaching
  - files
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - scripts
  - README.md
  - AGENTS.md
  - LICENSE
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - "package.json*"
  - package-lock.json
  - node_modules
  - vendor
  - .github
  - .devcontainer
  - .bundle
  - .asset-cache
  - .jekyll-cache
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - images/profile.png
  - images/bio-photo.jpg
  - images/bio-photo-2.jpg
  - images/og-image.png
  - "*.sublime-project"
  - "*.sublime-workspace"

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# No publication, teaching, talk, or portfolio detail pages are generated.
collections: {}
defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      published: false
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: posts
    values:
      published: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC
plugins:
  - jekyll-sitemap
whitelist:
  - jekyll-sitemap

compress_html:
  clippings: all
  ignore:
    envs: development
